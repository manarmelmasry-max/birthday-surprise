<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مفاجأة ليك ❤️</title><style>:root{--pink:#eb5e98;--deep:#a52a62;--cream:#fff8fb}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:Tahoma,Arial,sans-serif;color:#63334e;background:radial-gradient(circle at 12% 13%,#ffd9e9 0,transparent 34%),radial-gradient(circle at 88% 77%,#ffc4dc 0,transparent 40%),#fff0f6;display:grid;place-items:center;overflow-x:hidden}.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;bottom:-50px;animation:rise linear infinite;opacity:.5}@keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}main{position:relative;z-index:2;width:min(92vw,480px);background:#fffafddd;border:1px solid #ffffff;box-shadow:0 18px 65px #c63c7a24;border-radius:30px;padding:29px 23px;text-align:center;backdrop-filter:blur(12px)}.eyebrow{font-size:13px;letter-spacing:.4px;color:#bc6b93}h1{font-size:clamp(25px,6.3vw,35px);margin:10px 0 13px;color:#b72e6e;line-height:1.5}p{line-height:1.95}button{font-family:inherit;cursor:pointer;border:0} .primary{border-radius:35px;color:white;background:linear-gradient(130deg,#f06b9e,#c93679);padding:15px 25px;font-weight:700;font-size:16px;box-shadow:0 7px 22px #db5b8d45;width:100%;margin-top:15px}.secondary{border-radius:25px;color:#a33c6b;border:1px solid #efa2c3;background:#fff;padding:11px 18px;margin-top:9px}.hide{display:none}.big{font-size:58px;animation:bob 2.4s infinite ease-in-out}@keyframes bob{50%{transform:translateY(-10px)}}.bar{height:9px;border-radius:9px;background:#ffe0ec;overflow:hidden;margin:16px 0 20px}.bar span{display:block;background:linear-gradient(90deg,#f796ba,#db4281);height:100%;width:0;transition:width .5s}.count{color:#b47796;font-size:14px}#question{font-size:22px;line-height:1.7;min-height:90px}.choices{display:grid;gap:11px;text-align:right;margin-top:19px}.choice{background:white;border:1.5px solid #f6c8da;border-radius:18px;padding:14px 16px;font-size:16px;color:#763951;text-align:right;transition:all .2s}.choice:before{content:'♡';color:#dd71a0;font-size:21px;margin-left:11px}.choice:active{transform:scale(.98)}.choice.correct{background:#eafff3;border-color:#53bd89}.choice.wrong{background:#fff0f1;border-color:#eb8796}.choice:disabled{cursor:default}.feedback{min-height:43px;margin-top:15px;font-weight:700;line-height:1.8}.small{font-size:13px;color:#ab7890}.score{font-size:36px;font-weight:bold;color:#c93679}.letter{background:#fff0f5;border-radius:18px;padding:20px;line-height:2.2;border:1px dashed #eda2c2}.confetti{font-size:30px;letter-spacing:10px}label{display:block;text-align:right;margin:12px 0 6px;font-size:13px}input{width:100%;border:1px solid #edb5cf;border-radius:12px;padding:12px;font:inherit;color:#763951;outline-color:#d75b93}</style></head><body><div class="hearts" id="hearts"></div><main><section id="welcome"><div class="big">💌</div><div class="eyebrow">A LITTLE SURPRISE, JUST FOR YOU</div><h1>كل سنة وإنت حبيبي ❤️</h1><p>بما إن النهارده يومك المميز، عملتلك اختبار صغير… نشوف بقى إنت عارفني قد إيه؟ 👀💕</p><p class="small">5 أسئلة، وكل إجابة هتقربك من مفاجأتك!</p><button class="primary" onclick="start()">يلا نبدأ يا حبيبي 💗</button></section><section id="quiz" class="hide"><div class="count" id="count"></div><div class="bar"><span id="progress"></span></div><h1 id="question"></h1><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary hide" id="next" onclick="next()">السؤال اللي بعده 💕</button></section><section id="result" class="hide"><div class="big">🎂</div><h1>وصلت للمفاجأة! 💖</h1><div class="score" id="score"></div><p id="resultText"></p><div class="letter" id="letter">كل سنة وإنت أجمل حاجة في أيامي، ويا رب دايمًا أشوفك مبسوط وتفضل كل أيامك حلوة زي قلبك. بحبك ❤️</div><div class="confetti">💗✨💗</div><button class="secondary" onclick="restart()">نلعب تاني؟ ♡</button></section></main><script>
// لتعديل الأسئلة والإجابات: غيّري النصوص داخل القائمة دي. answer هو رقم الاختيار الصحيح، بداية من 0.
const questions=[
{q:'لو قدامك تختار حاجة واحدة بس باقي عمرك', options:['2 مليون درهم','ندى','عربية Lexus'],answer:1},
{q:'إيه أكتر حاجة بتحبها بدون غش؟', options:['رونالدو','المكرونة والبانيه','أكيد نونو هانم','مبحبش حاجة والله معنديش مشاعر'],answer:2},
{q:'مين الشخص اللي لازم تحكيله تفاصيل يومك المهمة؟', options:['مديرك في الشغل','أسامة','أنا راجل غامض مبحكيش لحد','ندودة طبعًا بدون تفكير'],answer:3},
{q:'مين أكتر حد وحشك وعايز تنزل تقضي معاه وقت كتيييير؟', options:['تيتي','ندي طبعًا 😌','صحابك البنات 😡','النوم المنتظم'],answer:1},
{q:'بكل أمانة ونزاهة مين أجمل وألطف وأحلى بنت في حياة أستاذ حسام؟ 😌', options:['ندى','ندى برضو','ندودة هانم','نونو'],answer:2}
];
const correctMessages=['يا سلام! اخترتني من وسط كل المغريات؟ كده أنا كسبانة الدنيا بيك 😍❤️','الله عليك! عارف مين رقم واحد في قلبك، شاطر يا حبيبي 🥹💗','أيوه كده! هو أنا عندي أحلى من إنك تحكيلي يومك كله؟ 💌','إيه الحلاوة دي! واضح إنك عارف مين اللي بتحب تقضي معاه أحلى وقت 😂💕','يا سلام على الذوق الحلو! كده إنت حافظ الإجابات اللي تفرّح نونو هانم 😂❤️'];
const wrongMessages=[
'إيه ده؟! يعني الفلوس والعربية أهم من ندى؟ 😭 خلاص اتحسبت عليك يا أستاذ 😂💔',
'يا خبر! كل الاختيارات دي وإنت مش شايف نونو هانم؟ هنحتاج نراجع أولوياتنا 😂🙄',
'بتحكي لغير ندودة؟! ماشي يا سيدي، أنا هفتكرلك السؤال ده كويس 😤💕',
'آه يعني في حد وحشك أكتر مني؟ طب ماشي يا حسام… اتقفشت رسمي 😂💔',
'مع إن كل الاختيارات تقريبًا أنا، عرفت تغلط برضه؟ دي موهبة نادرة والله 😂❤️'
];let index=0,score=0,chosen=false;const el=id=>document.getElementById(id);function show(id){['welcome','quiz','result'].forEach(s=>el(s).classList.toggle('hide',s!==id))}function start(){index=0;score=0;show('quiz');render()}function render(){chosen=false;let x=questions[index];el('count').textContent=`السؤال ${index+1} من ${questions.length}`;el('progress').style.width=`${index/questions.length*100}%`;el('question').textContent=x.q;el('feedback').textContent='';el('next').classList.add('hide');el('next').textContent=index===questions.length-1?'افتح المفاجأة 🎁':'السؤال اللي بعده 💕';el('choices').innerHTML='';x.options.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>pick(i);el('choices').appendChild(b)})}function pick(i){if(chosen)return;chosen=true;let x=questions[index],ok=i===x.answer;if(ok)score++;[...el('choices').children].forEach((b,n)=>{b.disabled=true;if(n===x.answer)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});el('feedback').textContent=ok?correctMessages[index]:wrongMessages[index]+' الإجابة الصح: '+x.options[x.answer]+' 💗';el('next').classList.remove('hide')}function next(){index++;if(index<questions.length){render()}else{el('progress').style.width='100%';show('result');el('score').textContent=`${score*10} / ${questions.length*10} ❤️`;el('resultText').textContent=score===questions.length?'إيه الجمال ده! إنت حافظني عن ظهر قلب 🥹💕':'المهم إنك كملت للآخر… والمفاجأة دي ليك مهما كانت نتيجتك 🥹💕'}}function restart(){start()}const emojis=['💗','💕','💖','♡','🌸'];for(let i=0;i<20;i++){let h=document.createElement('span');h.className='heart';h.textContent=emojis[i%emojis.length];h.style.left=Math.random()*100+'%';h.style.fontSize=15+Math.random()*20+'px';h.style.animationDuration=9+Math.random()*11+'s';h.style.animationDelay=-Math.random()*18+'s';el('hearts').appendChild(h)}
</script></body></html>
